<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Tab bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<body data-section="now">
<div class="card">
<h2>Tab bar</h2>
<p class="sub">Two tabs plus a 6px colour square each. The active cell is ink with its label in the section accent. About keeps its originating tab highlighted.</p>
<h3>Now active</h3><div class="stage" style="padding:0"><nav class="tabs" style="padding-bottom:0"><button class="tab on" style="color:#00e0a4"><span>NOW</span><i style="background:#00e0a4"></i></button><button class="tab" style="color:#111"><span>SCHEDULE</span><i style="background:#7b61ff"></i></button></nav></div><h3>Schedule active</h3><div class="stage" style="padding:0"><nav class="tabs" style="padding-bottom:0"><button class="tab" style="color:#111"><span>NOW</span><i style="background:#00e0a4"></i></button><button class="tab on" style="color:#7b61ff"><span>SCHEDULE</span><i style="background:#7b61ff"></i></button></nav></div>
</div>
</body></html>
