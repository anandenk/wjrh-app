<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Day picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../_card.css">
</head>
<body data-section="schedule">
<div class="card">
<h2>Day picker</h2>
<p class="sub">Seven cells. Today carries a 5px square; the selected cell inverts to ink with the square in the section accent.</p>
<div class="stage" style="padding:0"><div class="daypicker"><button class="daycell"><span>MON</span><i></i></button><button class="daycell"><span>TUE</span><i></i></button><button class="daycell"><span>WED</span><i></i></button><button class="daycell"><span>THU</span><i></i></button><button class="daycell sel today"><span>FRI</span><i></i></button><button class="daycell"><span>SAT</span><i></i></button><button class="daycell"><span>SUN</span><i></i></button></div></div>
</div>
</body></html>
