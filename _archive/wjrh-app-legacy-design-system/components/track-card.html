<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Track card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../_card.css">
</head>
<body data-section="now">
<div class="card">
<h2>Track card</h2>
<p class="sub">Title, artist and album. Album is a licence requirement, not decoration — the statutory webcasting licence requires all three to be displayed.</p>
<h3>Playing</h3><div class="stage"><button class="trackcard" style="width:100%"><div class="wave on"><i style="height:16px;animation-delay:0.00s;animation-duration:0.70s"></i><i style="height:30px;animation-delay:0.09s;animation-duration:0.85s"></i><i style="height:22px;animation-delay:0.18s;animation-duration:1.00s"></i><i style="height:36px;animation-delay:0.27s;animation-duration:1.15s"></i><i style="height:26px;animation-delay:0.36s;animation-duration:0.70s"></i><i style="height:14px;animation-delay:0.45s;animation-duration:0.85s"></i><i style="height:32px;animation-delay:0.54s;animation-duration:1.00s"></i><i style="height:20px;animation-delay:0.63s;animation-duration:1.15s"></i><i style="height:28px;animation-delay:0.72s;animation-duration:0.70s"></i></div><div class="row-body"><div class="label">Now playing</div><div class="trackcard-title syne ellipsis">Blue Monday 1988</div><div class="trackcard-artist ellipsis">New Order</div><div class="trackcard-album ellipsis">Substance</div></div></button></div><h3>No metadata — DJ on their own laptop</h3><div class="stage"><button class="trackcard" style="width:100%" disabled><div class="wave"><i style="height:16px"></i><i style="height:30px"></i><i style="height:22px"></i><i style="height:36px"></i><i style="height:26px"></i><i style="height:14px"></i><i style="height:32px"></i><i style="height:20px"></i><i style="height:28px"></i></div><div class="row-body"><div class="label" style="color:var(--disabled)">Now playing</div><div class="trackcard-title syne ellipsis">Live from the booth</div><div class="trackcard-artist ellipsis">Track info not posted yet</div></div></button></div>
</div>
</body></html>
