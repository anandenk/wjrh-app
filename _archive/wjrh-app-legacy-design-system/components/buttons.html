<div class="card">
<h2>Buttons</h2>
<p class="sub">Solid buttons carry a hard accent shadow and translate into it when pressed. Minimum tap target is 44px.</p>
<h3>Primary / secondary</h3><div class="stage" style="padding:0"><div class="btnrow"><button class="btn solid">Listen now</button><button class="btn">Remind me</button></div></div><h3>Active states</h3><div class="stage" style="padding:0"><div class="btnrow"><button class="btn on">Playing ✓</button><button class="btn on">Reminder on ✓</button></div></div><h3>Join — orange shadow</h3><div class="stage" style="padding:0"><div class="btnrow"><button class="btn solid" style="box-shadow:5px 5px 0 #ff5a1f;font-size:14px;padding:16px">Join the interest list</button></div></div><h3>Icon buttons</h3><div class="stage" style="padding:14px 18px;display:flex;gap:14px;align-items:center"><button class="ibtn"><span>i</span></button><button class="backbtn">← SCHEDULE</button></div>
</div>
