<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WJRH Website Photography</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background:#eee9df; color:#211c18; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px; }
    header { max-width:1100px; margin:0 auto 28px; }
    h1 { margin:0; font-size:clamp(30px,5vw,58px); line-height:1; }
    p { color:#655c54; }
    main { max-width:1100px; margin:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:22px; }
    figure { margin:0; background:#fffaf1; border:1px solid #d4c8b9; border-radius:8px; overflow:hidden; }
    img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#171411; }
    figcaption { padding:13px 15px 15px; font-weight:700; }
    small { display:block; margin-top:4px; color:#766b61; font-weight:400; }
  </style>
</head>
<body>
  <header>
    <h1>WJRH website photography</h1>
    <p>Nine existing station images, loaded directly from wjrh.org.</p>
  </header>
  <main>
    <figure><img src="https://www.wjrh.org/assets/images/home.jpg" alt="WJRH students gathered around a table of records"><figcaption>1 · home.jpg<small>Station group photograph</small></figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/about.jpg" alt="WJRH About photograph"><figcaption>2 · about.jpg</figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/history.jpg" alt="Historical WJRH studio photograph"><figcaption>3 · history.jpg<small>Skillman Library Special Collections</small></figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/our-team.jpg" alt="WJRH leadership team outside Hogg Hall"><figcaption>4 · our-team.jpg</figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/schedule.jpg" alt="WJRH studio hallway covered in posters"><figcaption>5 · schedule.jpg</figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/events.jpg" alt="WJRH table at the Lafayette club fair"><figcaption>6 · events.jpg</figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/get-involved.jpg" alt="WJRH Get Involved photograph"><figcaption>7 · get-involved.jpg<small>Photograph by Jaquan Alston</small></figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/supportwjrh.jpg" alt="Hogg Hall exterior"><figcaption>8 · supportwjrh.jpg</figcaption></figure>
    <figure><img src="https://www.wjrh.org/assets/images/contact.png" alt="WJRH Contact artwork"><figcaption>9 · contact.png</figcaption></figure>
  </main>
</body>
</html>
