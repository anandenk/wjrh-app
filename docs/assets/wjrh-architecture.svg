      .group{fill:#f8fafc;stroke:#d1dbe8;stroke-width:1.25}
      .group-label{font-size:18px;font-weight:700;fill:#526078}
      .node{stroke-width:1.5}
      .node-title{font-size:23px;font-weight:700}
      .small{font-size:16px;fill:#5d6d85}
      .edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
