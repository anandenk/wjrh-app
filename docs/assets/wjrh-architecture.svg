<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" role="img" aria-labelledby="title desc">
  <title id="title">WJRH prototype architecture</title>
  <desc id="desc">The native iOS and Android listener app receives live audio directly from the public station stream. It requests metadata and schedules from a Cloudflare Worker API, which reads the public now-playing feed and Google Calendar and stores recent history and cached snapshots in D1. The backend archive workflow is implemented, but the mobile Archive is a demo and real archive playback is planned. This is an independent, unofficial prototype.</desc>
