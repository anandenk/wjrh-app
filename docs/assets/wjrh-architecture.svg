  <text x="48" y="566" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5d6d85">Audio bypasses the API.</text>
  <text x="48" y="591" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5d6d85">Reminders are local to the device.</text>
