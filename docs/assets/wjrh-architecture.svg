  <text x="72" y="307" class="node-title" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e4093" font-weight="700">Native listener app</text>
  <text x="72" y="342" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#334155">Expo · React Native</text>
  <text x="72" y="371" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#334155">iOS + Android</text>
  <text x="72" y="415" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#334155">Now · Schedule · Station</text>
  <text x="72" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#334155">Offline cache · reminders</text>
