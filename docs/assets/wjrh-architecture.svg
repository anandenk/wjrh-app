  <text x="924" y="558" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#334155">Public schedule · iCalendar</text>
  <path d="M900 536 H842 Q828 536 828 522 V446 Q828 432 814 432 H766" class="edge" stroke="#c04a15" />
  <rect x="790" y="459" width="86" height="26" rx="3" fill="#fff" />
